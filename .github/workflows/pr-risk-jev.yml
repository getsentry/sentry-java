name: PR Risk (Jev)

on:
  pull_request_target:
    # Keep `edited`: it is the only event fired when the base branch changes.
    types: [opened, synchronize, reopened, ready_for_review, edited, converted_to_draft]

permissions: {}

concurrency:
  group: pr-risk-jev-${{ github.event.pull_request.number }}
  # Every started run must reach its label clear; an overtaken run ends as `pr_changed`.
  cancel-in-progress: false

jobs:
  risk:
    name: PR risk (Jev)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The Action reads PR Git objects without checking out or executing PR code. It clears the
      # PR's risk labels first and publishes the new one itself, using the shared SDK rubric and
      # the sentry-java fact sheet in getsentry/sdk-pr-risk-action.
      - name: Classify PR risk
        id: risk
        uses: getsentry/sdk-pr-risk-action@46f2c96d3085a7a1ccde115de9a10f941816e439 # main
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          result-path: risk-pr-result.json
          publish-label: true

      - name: Upload risk result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-risk-jev-${{ github.event.pull_request.number }}
          path: risk-pr-result.json
          if-no-files-found: warn
          retention-days: 30
