name: Spring Boot 4.x Matrix

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '*android*/**'
      - 'sentry-compose/**'
      - 'sentry-samples/sentry-samples-android/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    name: Spring Boot 4.x versions
    outputs:
      versions: ${{ steps.versions.outputs.versions }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: gradle

      - name: Read Spring Boot 4.x versions
        id: versions
        run: echo "versions=$(jq -c .boot4 gradle/spring-boot-versions.json)" >> "$GITHUB_OUTPUT"

  spring-boot-4-matrix:
    needs: versions
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        springboot-version: ${{ fromJSON(needs.versions.outputs.versions) }}

    name: Spring Boot ${{ matrix.springboot-version }}
    env:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # Workaround for https://github.com/gradle/actions/issues/21 to use config cache
      - name: Cache buildSrc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buildSrc/build
          key: build-logic-${{ hashFiles('buildSrc/src/**', 'buildSrc/build.gradle.kts','buildSrc/settings.gradle.kts') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test integration suites
        # Project paths, unlike a bare task name, keep Gradle from configuring every project.
        run: |
          task="allIntegrationTestsBoot${SPRINGBOOT_VERSION//./_}"
          ./gradlew ":sentry-spring-7:$task" ":sentry-spring-boot-4:$task"
        env:
          SPRINGBOOT_VERSION: ${{ matrix.springboot-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-springboot-4-${{ matrix.springboot-version }}
          path: |
            **/build/reports/*
            **/build/test-results/**/*.xml

      - name: Test Report
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # pin@v16
        if: always()
        with:
          name: JUnit Spring Boot 4.x ${{ matrix.springboot-version }}
          path: |
            **/build/test-results/**/*.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: false
