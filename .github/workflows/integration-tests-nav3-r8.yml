name: Nav3 serialName R8 Check

# Checks BackStackEntryMapper.SerialNames and SerialNamesAndArguments from
# sentry-android-navigation3 in R8-minified builds
# (full and compat mode, without kotlinx.serialization, and with it at the compile floor and newer
# versions) on an emulator.
# See sentry-android-integration-tests/nav3-serialname-r8-check/README.md.

on:
  push:
    branches:
      - main
    paths:
      - "sentry-android-navigation3/**"
      - "sentry-android-integration-tests/nav3-serialname-r8-check/**"
      - "sentry-android-integration-tests/*.gradle.kts"
      - "scripts/test-nav3-serialname-r8.sh"
      - "gradle/libs.versions.toml"
      - ".github/workflows/integration-tests-nav3-r8.yml"
  pull_request:
    paths:
      - "sentry-android-navigation3/**"
      - "sentry-android-integration-tests/nav3-serialname-r8-check/**"
      - "sentry-android-integration-tests/*.gradle.kts"
      - "scripts/test-nav3-serialname-r8.sh"
      - "gradle/libs.versions.toml"
      - ".github/workflows/integration-tests-nav3-r8.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_DIR: "nav3-r8-check-apks"
  APK_ARTIFACT_NAME: "nav3-r8-check-apks"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build APKs
        run: ./scripts/test-nav3-serialname-r8.sh build "${{ env.APK_DIR }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ${{ env.APK_DIR }}
          retention-days: 1

  run:
    name: Run on API Level 35
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ${{ env.APK_DIR }}

      - name: Run check
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # pin@v2.38.0
        with:
          api-level: 35
          target: google_apis
          channel: canary # Necessary for ATDs
          arch: x86_64
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -memory 4096 -no-window -gpu auto -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: ./scripts/test-nav3-serialname-r8.sh run "${{ env.APK_DIR }}"
