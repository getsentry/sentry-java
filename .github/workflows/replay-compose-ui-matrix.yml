name: 'Replay Compose UI Matrix'
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-compose-ui-matrix:
    name: Replay Compose UI Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java Version
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Replay Tests Against Each Compose UI Version
        run: ./gradlew :sentry-android-replay:testComposeUiMatrix -PcomposeUiTestMatrix

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-replay-compose-ui-matrix
          path: |
            sentry-android-replay/build/reports/*

      - name: Test Report
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # pin@v16
        if: always()
        with:
          name: JUnit Replay Compose UI Matrix
          list-suites: 'failed'
          list-tests: 'failed'
          path: |
            sentry-android-replay/build/test-results/**/*.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: false
