name: Spring Boot 3.x Matrix

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '*android*/**'
      - 'sentry-compose/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot-3-matrix:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Spring Boot 3.x

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Runs every version in gradle/spring-boot-3-versions.json; --continue reports each failing
      # one. Project paths, unlike a bare task name, keep Gradle from configuring every project.
      - name: Test integration suites
        run: ./gradlew :sentry-spring-jakarta:springBootTest :sentry-spring-boot-jakarta:springBootTest --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-springboot-3
          path: |
            **/build/reports/*
            **/build/test-results/**/*.xml

      - name: Test Report
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # pin@v16
        if: always()
        with:
          name: JUnit Spring Boot 3.x
          path: |
            **/build/test-results/**/*.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: false
