name: Session Replay Dependency Matrix

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-dependency-matrix:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: ${{ matrix.name }} Matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runs every version in gradle/compose-ui-versions.json
          - name: Compose UI
            task: composeUiTest
          # Runs every version in gradle/coil3-versions.json
          - name: Coil 3
            task: coil3Test

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java Version
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # --continue reports each failing version.
      - name: Run Session Replay unit tests
        run: ./gradlew :sentry-android-replay:${{ matrix.task }} --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.task }}
          path: |
            sentry-android-replay/build/reports/*
            sentry-android-replay/build/test-results/**/*.xml

      - name: Test Report
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # pin@v16
        if: always()
        with:
          name: JUnit ${{ matrix.name }}
          path: |
            sentry-android-replay/build/test-results/**/*.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: false
