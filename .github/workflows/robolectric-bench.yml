# Temporary benchmark for #6544. Not for merge.
# Runs only the core and replay Robolectric tests, so no other Gradle task competes for the CPU.
# "base" uses the test sources of main (f80997a995), "pr" uses the ones from #6544.
# Each job runs both, in turns, on the same runner.
name: Robolectric benchmark

on:
  push:
    branches:
      - romtsn/robolectric-bench

jobs:
  bench:
    name: bench paired ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java Version
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: CPU
        run: lscpu | grep -E "Model name|^CPU\(s\)"

      # Both variants run on the same runner, in turns, so runner hardware does not affect the
      # comparison. Round 0 is a warm-up: it downloads the android-all jars and warms the daemon.
      - name: Paired runs
        run: |
          run() {
            if [ "$1" = base ]; then
              git checkout f80997a995 -- sentry-android-core/src/test sentry-android-replay/src/test
            else
              git checkout HEAD -- sentry-android-core/src/test sentry-android-replay/src/test
            fi
            ./gradlew :sentry-android-core:compileReleaseUnitTestSources :sentry-android-replay:compileReleaseUnitTestSources -q
            ./gradlew :sentry-android-core:cleanTestReleaseUnitTest :sentry-android-replay:cleanTestReleaseUnitTest \
              :sentry-android-core:testReleaseUnitTest :sentry-android-replay:testReleaseUnitTest --no-build-cache -q
            python3 .github/workflows/robolectric-bench.py "$1" "$2"
          }
          run base r0; run pr r0
          run base r1; run pr r1
          run pr r2; run base r2
          run base r3; run pr r3
