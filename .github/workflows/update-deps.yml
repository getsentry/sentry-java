name: Update Dependencies

on:
  schedule:
    # Run every day.
    - cron: '0 3 * * *'
    # Run weekly (select btw daily or weekly via `if:`).
    - cron: '0 4 * * 1'
  # Also trigger on pushes to main (individual jobs decide whether to run). E.g., lets us get updated
  # dependencies ASAP and make sure the changelog doesn't conflict.
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # Update the Sentry Native SDK dependency daily and on pushes to main.
  native:
    if: github.event.schedule != '0 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/updater@36529d71129a14967bea1fb81bcaf2a5943cf877 # v3
        with:
          path: scripts/update-sentry-native-ndk.sh
          name: Native SDK
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}

  # Update weekly the kotlinx.serialization version used by the Nav3 R8 tests. (Verifying a new
  # version before the next SDK release is sufficient.)
  nav3-kotlinx-serialization:
    if: github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/updater@36529d71129a14967bea1fb81bcaf2a5943cf877 # v3
        with:
          path: scripts/update-nav3-kotlinx-serialization.sh
          name: Nav3 kotlinx.serialization R8 check
          # Only the R8 verification app uses this version; the SDK's dependency doesn't change.
          changelog-entry: false
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}
