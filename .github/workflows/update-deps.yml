name: Update Dependencies

on:
  # Run every day.
  schedule:
    - cron: '0 3 * * *'
  # And on on every PR merge so we get the updated dependencies ASAP, and to make sure the changelog doesn't conflict.
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/updater@959162c159b866489d3fabe93327f48f9b8cb7ee # v3
        with:
          path: scripts/update-sentry-native-ndk.sh
          name: Native SDK
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}

  nav3-kotlinx-serialization:
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/updater@959162c159b866489d3fabe93327f48f9b8cb7ee # v3
        with:
          path: scripts/update-nav3-kotlinx-serialization.sh
          name: Nav3 kotlinx.serialization (R8 check latest)
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}
