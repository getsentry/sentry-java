name: Compose UI Matrix

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    name: Compose UI versions
    outputs:
      versions: ${{ steps.versions.outputs.versions }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: gradle

      - name: Read Compose UI versions
        id: versions
        run: echo "versions=$(jq -c 'map(.version? // .)' gradle/compose-ui-versions.json)" >> "$GITHUB_OUTPUT"

  compose-ui-matrix:
    needs: versions
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose-ui: ${{ fromJSON(needs.versions.outputs.versions) }}

    name: Compose UI ${{ matrix.compose-ui }}
    env:
      COMPOSE_UI_VERSION: ${{ matrix.compose-ui }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java Version
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Session Replay unit tests
        run: ./gradlew ":sentry-android-replay:composeUiTest${COMPOSE_UI_VERSION//[.-]/_}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-compose-ui-${{ matrix.compose-ui }}
          path: |
            sentry-android-replay/build/reports/*
            sentry-android-replay/build/test-results/**/*.xml

      - name: Test Report
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # pin@v16
        if: always()
        with:
          name: JUnit Compose UI ${{ matrix.compose-ui }}
          path: |
            sentry-android-replay/build/test-results/**/*.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: false
