version: 2
registries:
  gradle-plugin-portal:
    type: maven-repository
    url: https://plugins.gradle.org/m2
    username: dummy # Required by dependabot
    password: dummy # Required by dependabot
updates:
  - package-ecosystem: "gradle"
    # The separate sample and test builds read this build's version catalog, so one directory
    # covers them. Listing them too opens one PR per directory for the same bump.
    directory: "/"
    registries:
      - gradle-plugin-portal
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "org.springframework.boot*"
      - dependency-name: "io.opentelemetry*"
      # DGS 5+ needs Spring Boot 3; the sample is on Spring Boot 2.
      - dependency-name: "com.netflix.graphql.dgs*"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
