# Dependency test matrices, registered as the `matrixLibs` catalog: compile against the oldest
# supported version and test against newer releases too.
#
# Kept apart from libs.versions.toml so that each matrix's tests can run on PRs that change its
# versions, without also running on every unrelated dependency bump.
#
# Each matrix <name> has up to three version keys, named by role:
#
# - <name>-floor: the oldest version we support, which we compile and test against. Only changed
#   by hand, in a reviewed change. No library entry references it, so Dependabot never bumps it.
#   Builds apply it explicitly (e.g., `version { strictly(...) }`) instead.
# - <name>-stable: the latest stable release. Bumped by Dependabot through the <name>-stableTracker
#   library entry, which references it and is used by no build.
# - <name>-preview: the latest pre-release, which is tested only while it's newer than
#   <name>-stable. Bumped by a weekly updater job in .github/workflows/update-deps.yml. No library
#   entry references it, so Dependabot never bumps it.
#
# Rules for adding a matrix:
#
# - Never give the floor or preview keys a library entry with `version.ref`, and never protect them
#   with a Dependabot `ignore` rule: ignore rules match a dependency's group and name, so they would
#   also stop Dependabot from bumping <name>-stable.
# - A stableTracker entry mustn't share its module with any entry or build file declaration that
#   Dependabot also updates (e.g., in libs.versions.toml). Dependabot merges declarations of one
#   module and bumps them all to one version. If they would collide, track a sibling artifact
#   instead (e.g., `-jvm`).
#
# scripts/dependency-matrix.sh reads and writes these keys for CI and the updater jobs.

[versions]
# The oldest kotlinx.serialization version sentry-android-navigation3 supports, which it compiles and
# tests against. Before changing it, read the rules under "Version floor" in
# sentry-android-navigation3/src/main/kotlin/io/sentry/compose/navigation3/internal/backstack/kotlinx/README.md.
kotlinxSerialization-floor = "1.7.3"
kotlinxSerialization-stable = "1.13.0"
# kotlinx.serialization publishes release candidates (-RC), but no alpha or beta releases.
kotlinxSerialization-preview = "1.12.0-RC"

[libraries]
# Applied with the floor version by the builds that use it.
kotlinxSerialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core" }
kotlinxSerialization-stableTracker = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization-stable" }
