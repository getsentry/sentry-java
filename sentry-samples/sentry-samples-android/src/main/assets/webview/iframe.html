<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Same origin as the page, but an iframe: the trace must only reach the main frame.
      window.traceAtHeadStart = document.querySelector('meta[name="sentry-trace"]');
    </script>
  </head>
  <body style="font-family: sans-serif; margin: 8px">
    <span id="status"></span>
    <script>
      var injected = !!window.traceAtHeadStart;
      document.getElementById('status').textContent = injected ? 'iframe: trace injected' : 'iframe: no trace';
      if (window.SentrySample) {
        SentrySample.onIframeTrace(injected);
      }
    </script>
  </body>
</html>
