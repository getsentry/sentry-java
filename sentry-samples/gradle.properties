# Gradle properties are per build, so this repeats what the samples need from the SDK build's
# gradle.properties. settings.gradle.kts reads the SDK version from that file.

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+CrashOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.stdlib.default.dependency=false

systemProp.org.gradle.internal.http.socketTimeout=120000
